# Render "Blueprint": one-click cloud deployment of the API + dashboard (free plan).
# Database: create a free Postgres at neon.tech and paste its connection string into DATABASE_URL.
services:
  - type: web
    name: mediapulse
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # you paste the Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true    # Render creates a random secret
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false

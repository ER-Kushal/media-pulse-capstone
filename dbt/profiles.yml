# This file normally lives at ~/.dbt/profiles.yml (NOT inside the project
# folder, and NOT committed to git if it ever contains real secrets).
# For this project we read the password from an env var so nothing
# sensitive is hardcoded or committed.

mediapulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PGUSER', 'mediapulse') }}"
      password: "{{ env_var('PGPASSWORD', 'mediapulse_dev_pw') }}"
      dbname: "{{ env_var('PGDATABASE', 'mediapulse') }}"
      schema: public
      threads: 4
